<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="painel" id="painel-metas">
      <div class="cartao">
        <button><a href="paginaInicial.html" target="_self">Voltar</a></button>
        <h2>Nova meta</h2>
        <div class="linha-formulario">
          <div class="campo">
            <label>Nome da meta</label>
            <input
              type="text"
              id="meta-nome"
              placeholder="Ex: Reserva de emergência"
            />
          </div>
          <div class="campo campo-media">
            <label>Valor alvo (R$)</label>
            <input
              type="number"
              id="meta-valor-alvo"
              step="0.01"
              placeholder="0,00"
            />
          </div>
          <div class="campo campo-media">
            <label>Já guardado (R$)</label>
            <input
              type="number"
              id="meta-valor-atual"
              step="0.01"
              placeholder="0,00"
            />
          </div>
          <div class="campo campo-media">
            <label>Data limite</label>
            <input type="date" id="meta-data-limite" />
          </div>
        </div>
        <div class="rodape-formulario">
          <button class="botao-primario" id="meta-botao-adicionar">
            Criar meta
          </button>
        </div>
      </div>

      <div class="cartao">
        <h2>Suas metas</h2>
        <div id="meta-lista"></div>
      </div>
    </section>
  </body>
</html>

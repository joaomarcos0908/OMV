<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMV - Metas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../CSS/estilosPagSecundarias.css" />
  </head>
  <body>
    <div class="aplicativo">
      <header class="cabecalho-topo">
        <div>
          <span class="marca-eyebrow">livro-caixa pessoal</span>
          <h1>OMV-Organiza Minha Vida</h1>
        </div>
        <a href="../index.html" class="botao-voltar">Voltar</a>
        <span class="status-salvamento" id="status-salvamento"
          >carregando...</span
        >
      </header>
      <section class="painel ativo" id="painel-metas">
        <div class="cartao">
          <h2>Nova meta</h2>
          <div class="linha-formulario">
            <div class="campo">
              <label>Nome da meta</label>
              <input
                type="text"
                id="meta-nome"
                placeholder="Ex: Reserva de emergência"
              />
            </div>
            <div class="campo campo-media">
              <label>Valor alvo (R$)</label>
              <input
                type="number"
                id="meta-valor-alvo"
                step="0.01"
                placeholder="0,00"
              />
            </div>
            <div class="campo campo-media">
              <label>Já guardado (R$)</label>
              <input
                type="number"
                id="meta-valor-atual"
                step="0.01"
                placeholder="0,00"
              />
            </div>
            <div class="campo campo-media">
              <label>Data limite</label>
              <input type="text" id="meta-data-limite" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" />
            </div>
          </div>
          <div class="rodape-formulario">
            <button class="botao-primario" id="meta-botao-adicionar">
              Criar meta
            </button>
          </div>
        </div>

        <div class="cartao">
          <h2>Suas metas</h2>
          <div id="meta-lista"></div>
        </div>
      </section>
    </div>
    <script src="../JS/auth.js"></script>
    <script src="../JS/metas.js"></script>
  </body>
</html>

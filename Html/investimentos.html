    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OMV — Organiza Minha Vida" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Investimentos — OMV | Organiza Minha Vida" />
    <meta property="og:description" content="Carteira de investimentos com cotação automática de ações, FIIs, fundos e criptomoedas, em reais." />

  </head>
  <body>
    <div class="aplicativo">
      <header class="cabecalho-topo">
        <div>
          <span class="marca-eyebrow">livro-caixa pessoal</span>
          <h1>
            <img class="marca-logo" src="/assets/marca.svg" alt="" width="22" height="22" />
            OMV
          </h1>
        </div>
        <nav class="menu-abas" aria-label="Navegação principal">
          <a class="aba-botao" href="/app">Início</a>
          <a class="aba-botao ativo" aria-current="page">Investimentos</a>
          <a class="aba-botao" href="/app/metas">Metas</a>
        </nav>
        <span class="status-salvamento" id="status-salvamento" role="status" aria-live="polite"
          >carregando...</span
        >
        <button id="botao-sair" class="botao-voltar botao-perigo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          Sair
        </button>
      </header>
      <section class="painel ativo" id="painel-investimentos">
        <div class="grade-indicadores" id="investimento-resumo"></div>

        <div class="cartao">
          <h2>Novo ativo</h2>
          <div class="linha-formulario">
            <div class="campo">
              <label for="investimento-nome">Ticker / nome</label>
              <input
                type="text"
                id="investimento-nome"
                placeholder="Ex: PETR4, BTC, CDB Banco X"
              />
            </div>
            <div class="campo">
              <label for="investimento-tipo">Tipo</label>
              <select id="investimento-tipo">
                <option>Ações</option>
                <option>FIIs</option>
                <option>Renda Fixa</option>
                <option>Tesouro Direto</option>
                <option>Criptomoedas</option>
                <option>Fundos</option>
                <option>Outros</option>
              </select>
            </div>
          </div>

          <!-- grupo padrão: quantidade + preço médio -->
          <div class="linha-formulario" id="grupo-padrao">
            <div class="campo campo-estreita">
              <label for="investimento-quantidade">Quantidade</label>
              <input
                type="number"
                id="investimento-quantidade"
                step="0.000001"
                placeholder="Ex: 10"
                value="1"
              />
            </div>
            <div class="campo campo-media">
              <label for="investimento-preco-medio">Preço médio (R$)</label>
              <input
                type="text"
                id="investimento-preco-medio"
                inputmode="decimal"
                placeholder="0,00"
              />
            </div>
          </div>

          <div
            class="linha-formulario"
            id="grupo-renda-fixa"
            style="display: none"
          >
            <div class="campo campo-media">
              <label for="rendafixa-data-aplicacao">Data da aplicação</label>
              <input type="text" id="rendafixa-data-aplicacao" placeholder="dd/mm/aaaa" inputmode="numeric" maxlength="10" />
            </div>
            <div class="campo campo-media">
              <label for="rendafixa-valor-aplicado">Valor aplicado (R$)</label>
              <input
                type="text"
                id="rendafixa-valor-aplicado"
                inputmode="decimal"
                placeholder="0,00"
              />
            </div>
            <div class="campo">
              <label for="rendafixa-tipo-rendimento">Tipo de rendimento</label>
              <select id="rendafixa-tipo-rendimento">
                <option value="cdi">% do CDI</option>
                <option value="selic">% da Selic</option>
                <option value="pre">Prefixado (taxa fixa % a.a.)</option>
                <option value="ipca">IPCA + taxa % a.a.</option>
              </select>
            </div>
            <div class="campo campo-media">
              <label id="rendafixa-taxa-rotulo"
                >Percentual do CDI (ex: 100)</label
              >
              <input
                type="number"
                id="rendafixa-taxa"
                step="0.01"
                placeholder="100"
              />
            </div>
            <div class="campo campo-estreita" id="grupo-ipca-info" style="display:none">
              <label for="grupo-ipca-info">IPCA atual</label>
              <div class="ipca-info-valor" id="ipca-info-texto">—</div>
            </div>
          </div>

          <div class="texto-ajuda" id="investimento-texto-ajuda">
          </div>
          <div class="rodape-formulario">
            <button class="botao-primario" id="investimento-botao-adicionar">
              Adicionar ativo
            </button>
          </div>
        </div>

        <div class="cartao">
          <h2>Carteira</h2>
          <div class="tabela-wrapper">
          <table>
            <thead>
              <tr>
                <th>Ativo</th>
                <th>Tipo</th>
                <th class="numero">Investido</th>
                <th class="numero">Atual</th>
                <th class="numero">Retorno</th>
                <th class="celula-acoes"></th>
              </tr>
            </thead>
            <tbody id="investimento-tabela-corpo"></tbody>
          </table>
          </div>
          <div class="rodape-formulario">
            <button
              class="botao-secundario"
              id="investimento-botao-atualizar-tudo"
            >
              Atualizar todas as cotações
            </button>
          </div>
        </div>

        <div class="linha-graficos">
          <div class="cartao">
            <h2>Distribuição da carteira</h2>
            <div style="position: relative; height: 220px">
              <canvas
                id="grafico-distribuicao"
                role="img"
                aria-label="Gráfico de pizza mostrando a distribuição da carteira por tipo de ativo"
              ></canvas>
            </div>
            <div class="legenda" id="legenda-distribuicao"></div>
          </div>
          <div class="cartao">
            <h2>Retorno por ativo</h2>
            <div style="position: relative; height: 220px">
              <canvas
                id="grafico-retorno"
                role="img"
                aria-label="Gráfico de barras mostrando o retorno percentual de cada ativo"
              ></canvas>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script src="/assets/vendor/chart.umd.js"></script>
    <footer class="rodape-privacidade"><a href="/privacidade">Política de privacidade</a><a href="/app/privacidade">Meus dados</a><a href="mailto:joaomarcosnog10@gmail.com">Contato de privacidade</a></footer>
    <script src="/JS/auth.js"></script>
    <script src="/JS/interface.js"></script>
    <script src="/JS/investimentos.js"></script>
  </body>
</html>

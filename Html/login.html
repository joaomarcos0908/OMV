    <link rel="stylesheet" href="/CSS/estilosLogin.css" />
    <link rel="stylesheet" href="/CSS/interface.css" />
  </head>
  <body>
    <div class="aplicativo">
      <header class="cabecalho-topo">
        <img
          class="marca-logo marca-logo--login"
          src="/assets/marca.svg"
          alt=""
          width="56"
          height="56"
        />
        <span class="marca-eyebrow">livro-caixa pessoal</span>
        <h1>OMV<br />Organiza Minha Vida</h1>
      </header>
      <div class="cartao-tech login-card">
        <div role="alert" id="alerta-login" class="alerta erro"></div>
        <form id="login-tab" class="tab ativo">
          <h2>Bem-vindo de volta</h2>
          <div class="campo">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="login-email" autocomplete="username" required placeholder="seu@email.com" />
          </div>
          <div class="campo">
            <label for="login-senha">Senha</label>
            <div class="senha-controle"><input type="password" id="login-senha" name="login-senha" autocomplete="current-password" required placeholder="Sua senha" /><button type="button" data-senha="login-senha" aria-controls="login-senha" aria-pressed="false">Mostrar senha</button></div>
          </div>
          <button class="btn-login" id="login-botao">Entrar</button>
          <div class="form-footer">
            <span class="texto-ajuda-login">Primeiro acesso?</span>
            <button type="button" class="link-cadastro" id="link-cadastro">Criar conta</button>
          </div>
        </form>
        <form id="cadastro-tab" class="tab">
          <h2>Criar conta</h2>
          <div class="alerta" role="alert" id="alerta-cadastro"></div>
          <div class="campo">
            <label for="cadastro-nome">Nome</label>
            <input type="text" id="cadastro-nome" name="cadastro-nome" autocomplete="name" required placeholder="Seu nome" />
          </div>
          <div class="campo">
            <label for="cadastro-email">Email</label>
            <input type="email" id="cadastro-email" name="cadastro-email" autocomplete="email" required placeholder="seu@email.com" />
          </div>
          <div class="campo">
            <label for="cadastro-senha">Senha</label>
            <div class="senha-controle"><input type="password" minlength="8" maxlength="128" id="cadastro-senha" name="cadastro-senha" autocomplete="new-password" required placeholder="De 8 a 128 caracteres" /><button type="button" data-senha="cadastro-senha" aria-controls="cadastro-senha" aria-pressed="false">Mostrar senha</button></div>
          </div>
          <button class="btn-login" id="cadastro-botao">Criar conta</button>
          <div class="form-footer">
            <span></span>
            <button type="button" class="link-cadastro" id="link-login">Voltar para login</button>
          </div>
        </form>
      </div>
    </div>
    <script src="/JS/auth.js"></script>
    <script src="/JS/interface.js"></script>
    <script src="/JS/login.js"></script>
  </body>
</html>
